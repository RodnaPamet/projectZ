# The expiry sweep, on a schedule.
#
# ═══ WHY THIS EXISTS ═══
#
# `POST /api/cron/release-expired-bookings` shipped in #119 and NOTHING EVER
# CALLED IT. There is no vercel.json, and neither ops/ nor .github/workflows
# referenced the route. An abandoned checkout held its court indefinitely, and
# the availability endpoint mirrors the exclusion constraint exactly, so the
# hold was invisible in the UI too.
#
# Since #136 it is also the ONLY thing that returns wallet credit spent on an
# abandoned checkout. `checkoutBooking` spends the wallet before charging the
# card, so a player who closes the tab has had credit debited for a court they
# never got. Unscheduled, that credit stays spent — permanently, and with no
# audit entry, because nothing knows it happened.
#
# ═══ HOW TO USE IT ═══
#
#   docker compose -f deploy/docker-compose.prod.yml -f ops/sweep.compose.yml up -d
#
# An OVERLAY on deploy/docker-compose.prod.yml, not a stack of its own. Copy it
# beside that file on the host, as that file is, and name both.
#
# ═══ IT TARGETS `playerz-app` ON `internal`, AND BOTH ARE LOAD-BEARING ═══
#
# This file used to say `depends_on: app` and `http://app:3000`, written when
# the repo had no production compose file. #221 added one and #230 named the
# service `playerz-app`, and from then on the overlay was not a valid compose
# project at all — measured:
#
#   docker compose -f deploy/docker-compose.prod.yml -f ops/sweep.compose.yml config
#   service "grant-expiry-warn" depends on undefined service "app"
#
# So nothing here could have been running against production, and neither sweep
# nor the grant warning ran anywhere.
#
# `networks: [internal]` is the other half. The prod services all name their
# networks, so an overlay service left on the implicit `default` network cannot
# resolve `playerz-app` at all. And it must be `internal` and NEVER
# `agrent_internal`: on that network `app` is ANOTHER product's container
# (see the header of deploy/docker-compose.prod.yml), and a sweep that resolved
# it would POST our CRON_SECRET to someone else's application every minute.
#
# ═══ WHY A LOOP AND NOT A CRON IMAGE ═══
#
# No new image to trust. `alpine` is already in every layer cache, and busybox
# `wget` is enough to POST a header. A cron scheduler would buy minute-aligned
# firing, which is worth nothing here: the sweep is idempotent, capped at 500
# bookings per run, and reports `truncated` when a backlog remains.
# Every container's log is capped (#440): Docker's json-file driver, rotated at
# 10 MB and kept to 3 files, so one noisy container holds at most 30 MB of the
# disk this VM shares with agrent. Set per service, never in the daemon's
# config, which is agrent's too. Applies when a container is (re)created.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  booking-sweep:
    image: alpine:3
    container_name: playerz-booking-sweep
    logging: *logging
    restart: unless-stopped
    depends_on:
      - playerz-app
    networks: [internal]
    environment:
      # No default. A sweep running without the secret gets a 401 for ever and
      # looks exactly like a sweep with nothing to do.
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required for the expiry sweep}
      SWEEP_URL: ${SWEEP_URL:-http://playerz-app:3000/api/cron/release-expired-bookings}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-60}
    # `--post-data=""` is how BUSYBOX wget sends a POST. It has no `--method`
    # flag at all — that is GNU wget, and using it here fails every request
    # with a usage error that the loop reports as "app down, or wrong secret".
    # Found by running it: `wget --help` in alpine:3 lists
    # `--post-data STR | --post-file FILE` and nothing else.
    #
    # `-O-` writes the body to stdout so `released` and `creditRefundedCents`
    # land in the container log. `--header` keeps the secret out of the URL,
    # which would otherwise reach access logs and `ps`.
    #
    # `$$` throughout: compose interpolates `${VAR}` at CONFIG time from the
    # host environment. These must survive into the container and be expanded
    # by ITS shell, from the `environment:` block above — written with a single
    # `$` they resolve to empty strings at `docker compose up` and the loop
    # silently POSTs to nowhere with no secret.
    command:
      - /bin/sh
      - -c
      - |
        echo "sweep: every $${SWEEP_INTERVAL_SECONDS}s -> $${SWEEP_URL}"
        while true; do
          sleep "$${SWEEP_INTERVAL_SECONDS}"
          body=$$(wget -q -O- --post-data="" \
            --header="x-cron-secret: $${CRON_SECRET}" \
            "$${SWEEP_URL}" 2>&1) \
            && case "$$body" in
                 *'"released":0'*'"truncated":false'*) : ;;   # nothing to do — stay quiet
                 *) echo "sweep: $$body" ;;
               esac \
            || echo "sweep: request failed (app down, or wrong secret)"
        done

  # ═══════════════════════════════════════════════════════════════════
  #  The completion sweep: CONFIRMED -> COMPLETED once a booking ends.
  #
  #  A review needs a COMPLETED booking as its proof of visit, and this is
  #  the only thing that ever sets that status. Unscheduled, nobody can
  #  review anything — silently, since the review form simply never
  #  appears. Same shape as booking-sweep and the same one-minute cadence:
  #  a player who has just walked off the court should not wait long to
  #  rate it, and a run with nothing to do reads one index and returns.
  # ═══════════════════════════════════════════════════════════════════
  booking-complete:
    image: alpine:3
    container_name: playerz-booking-complete
    logging: *logging
    restart: unless-stopped
    depends_on:
      - playerz-app
    networks: [internal]
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required for the completion sweep}
      COMPLETE_URL: ${COMPLETE_URL:-http://playerz-app:3000/api/cron/complete-ended-bookings}
      COMPLETE_INTERVAL_SECONDS: ${COMPLETE_INTERVAL_SECONDS:-60}
    # busybox wget, `--post-data=""`, `$$` escaping — see booking-sweep above.
    command:
      - /bin/sh
      - -c
      - |
        echo "complete: every $${COMPLETE_INTERVAL_SECONDS}s -> $${COMPLETE_URL}"
        while true; do
          sleep "$${COMPLETE_INTERVAL_SECONDS}"
          body=$$(wget -q -O- --post-data="" \
            --header="x-cron-secret: $${CRON_SECRET}" \
            "$${COMPLETE_URL}" 2>&1) \
            && case "$$body" in
                 *'"completed":0'*'"truncated":false'*) : ;;   # nothing ended — stay quiet
                 *) echo "complete: $$body" ;;
               esac \
            || echo "complete: request FAILED -> $$body"
        done

  # ═══════════════════════════════════════════════════════════════════
  #  The platform-grant expiry warning.
  #
  #  Same shape, same reason, and the reason is that this file exists at
  #  all: `POST /api/cron/release-expired-bookings` shipped in #119 and
  #  nothing called it for seventeen prompts. The grant-expiry route
  #  shipped in #174 and would have repeated that exactly — written,
  #  tested, reachable, and never invoked.
  #
  #  ═══ WHY DAILY AND NOT EVERY MINUTE ═══
  #
  #  The route warns inside a 7-day horizon, so the useful question is
  #  "did anyone see it today", not "was it caught within the minute".
  #  Running it per-minute would emit the same warning 1,440 times and
  #  teach everyone to filter it out, which is how an alert stops working.
  #
  #  It is read-only: it cannot extend a grant, and the immutability
  #  trigger would refuse it if it tried. So a missed run delays a warning
  #  and loses nothing.
  # ═══════════════════════════════════════════════════════════════════
  grant-expiry-warn:
    image: alpine:3
    container_name: playerz-grant-expiry-warn
    logging: *logging
    restart: unless-stopped
    depends_on:
      - playerz-app
    networks: [internal]
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required for the grant-expiry warning}
      WARN_URL: ${WARN_URL:-http://playerz-app:3000/api/cron/warn-expiring-platform-grants}
      WARN_INTERVAL_SECONDS: ${WARN_INTERVAL_SECONDS:-86400}
    # busybox wget, `--post-data=""`, `$$` escaping — all for the reasons
    # spelled out on booking-sweep above. Do not switch to `--method=POST`:
    # that is GNU wget and busybox fails every request with a usage error.
    #
    # NOTE the loop order differs from booking-sweep DELIBERATELY: that one
    # sleeps before its first request, this one requests first. At a 60s
    # interval the difference is invisible; at 86400s, sleeping first means a
    # restarted container tells you nothing for a full day — including about a
    # grant that lapses tomorrow.
    command:
      - /bin/sh
      - -c
      - |
        echo "grant-expiry: every $${WARN_INTERVAL_SECONDS}s -> $${WARN_URL}"

        # ═══ WAIT FOR THE APP BEFORE THE FIRST REQUEST ═══
        #
        # `depends_on` without `condition: service_healthy` waits for the
        # container to START, not to be LISTENING — and this is an overlay, so
        # the app service is defined elsewhere and may have no healthcheck to
        # depend on.
        #
        # Requesting first (rather than sleeping first, as booking-sweep does) is
        # deliberate: at 86400s, sleeping first means a restarted container says
        # nothing for a full day. But it also means the very first request races
        # the app's startup — and on losing that race the loop would log
        # "request failed" and then sleep TWENTY-FOUR HOURS before trying again.
        # So the benefit of going first needs this wait to be real.
        #
        # 30 attempts at 2s: a minute of grace, then proceed anyway so a genuinely
        # broken app still produces a logged failure rather than silence.
        i=0
        while [ "$$i" -lt 30 ]; do
          wget -q -O- --spider "$${WARN_URL}" 2>/dev/null && break
          # --spider on a POST-only route answers 405, which still proves the app
          # is listening. Any response at all is enough; only a connection
          # failure means "not up yet".
          wget -q -O- --post-data="" --header="x-cron-secret: $${CRON_SECRET}" \
            "$${WARN_URL}" >/dev/null 2>&1 && break
          i=$$((i + 1))
          sleep 2
        done
        echo "grant-expiry: app reachable after $${i} attempt(s); starting"

        while true; do
          # stderr is CAPTURED, not discarded. The previous version printed a
          # fixed "app down, or wrong secret" for every failure — including DNS
          # failures, TLS errors and 500s, none of which that sentence describes.
          # A wrong diagnosis sends somebody to check the wrong thing.
          body=$$(wget -q -O- --post-data="" \
            --header="x-cron-secret: $${CRON_SECRET}" \
            "$${WARN_URL}" 2>&1) \
            && case "$$body" in
                 *'"expiringSoon":0'*'"lapsed":0'*) : ;;   # nothing expiring — stay quiet
                 *) echo "grant-expiry: $$body" ;;
               esac \
            || echo "grant-expiry: request FAILED -> $$body"
          sleep "$${WARN_INTERVAL_SECONDS}"
        done

  # ═══════════════════════════════════════════════════════════════════
  #  Notifications (#367): the 3-hour reminder and the email outbox.
  #
  #  booking-reminders claims each CONFIRMED booking starting in 2–3 hours
  #  (once per booking, DST-safe: absolute time), writes the bell row and the
  #  reminder email, then drains the outbox once. Every 5 minutes, so a
  #  reminder lands 3 h to 2 h 55 min before the start.
  #
  #  email-outbox sends what the booking, cancel and desk routes queued:
  #  confirmations and club cancellations. Every minute. With no
  #  RESEND_API_KEY / SMTP_HOST in the app's .env it is log-only and sends
  #  nothing (rows are marked SENT by `log`); the bell works either way.
  #  On staging it is ALWAYS log-only unless EMAIL_ALLOW_ON_STAGING=1.
  #
  #  Same shape as booking-sweep: busybox wget, `--post-data=""`, `$$`.
  # ═══════════════════════════════════════════════════════════════════
  booking-reminders:
    image: alpine:3
    container_name: playerz-booking-reminders
    logging: *logging
    restart: unless-stopped
    depends_on:
      - playerz-app
    networks: [internal]
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required for the booking reminders}
      REMIND_URL: ${REMIND_URL:-http://playerz-app:3000/api/cron/send-booking-reminders}
      REMIND_INTERVAL_SECONDS: ${REMIND_INTERVAL_SECONDS:-300}
    command:
      - /bin/sh
      - -c
      - |
        echo "reminders: every $${REMIND_INTERVAL_SECONDS}s -> $${REMIND_URL}"
        while true; do
          sleep "$${REMIND_INTERVAL_SECONDS}"
          body=$$(wget -q -O- --post-data="" \
            --header="x-cron-secret: $${CRON_SECRET}" \
            "$${REMIND_URL}" 2>&1) \
            && case "$$body" in
                 *'"claimed":0'*) : ;;   # nothing due — stay quiet
                 *) echo "reminders: $$body" ;;
               esac \
            || echo "reminders: request FAILED -> $$body"
        done

  email-outbox:
    image: alpine:3
    container_name: playerz-email-outbox
    logging: *logging
    restart: unless-stopped
    depends_on:
      - playerz-app
    networks: [internal]
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required for the email outbox}
      OUTBOX_URL: ${OUTBOX_URL:-http://playerz-app:3000/api/cron/drain-email-outbox}
      OUTBOX_INTERVAL_SECONDS: ${OUTBOX_INTERVAL_SECONDS:-60}
    command:
      - /bin/sh
      - -c
      - |
        echo "outbox: every $${OUTBOX_INTERVAL_SECONDS}s -> $${OUTBOX_URL}"
        while true; do
          sleep "$${OUTBOX_INTERVAL_SECONDS}"
          body=$$(wget -q -O- --post-data="" \
            --header="x-cron-secret: $${CRON_SECRET}" \
            "$${OUTBOX_URL}" 2>&1) \
            && case "$$body" in
                 *'"claimed":0'*) : ;;   # nothing queued — stay quiet
                 *) echo "outbox: $$body" ;;
               esac \
            || echo "outbox: request FAILED -> $$body"
        done

  # ═══════════════════════════════════════════════════════════════════
  #  The media sweep (#366): deletes venue-photo objects no row names.
  #
  #  A removed photo's objects are deleted right after its row, so this
  #  only catches what that missed: storage down at the moment of a
  #  delete, a venue or club removed (its rows cascade, its objects do
  #  not), an upload that died between its objects and its row. Only
  #  objects over a day old are touched. Daily, request first, as the
  #  grant warning: a restarted container should not wait a day. With
  #  media storage not configured the route answers `"scanned":0`.
  # ═══════════════════════════════════════════════════════════════════
  media-sweep:
    image: alpine:3
    container_name: playerz-media-sweep
    logging: *logging
    restart: unless-stopped
    depends_on:
      - playerz-app
    networks: [internal]
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required for the media sweep}
      MEDIA_SWEEP_URL: ${MEDIA_SWEEP_URL:-http://playerz-app:3000/api/cron/sweep-orphan-media}
      MEDIA_SWEEP_INTERVAL_SECONDS: ${MEDIA_SWEEP_INTERVAL_SECONDS:-86400}
    # busybox wget, `--post-data=""`, `$$` escaping: see booking-sweep above.
    command:
      - /bin/sh
      - -c
      - |
        echo "media-sweep: every $${MEDIA_SWEEP_INTERVAL_SECONDS}s -> $${MEDIA_SWEEP_URL}"
        sleep 120   # let the app finish booting before the first run
        while true; do
          body=$$(wget -q -O- --post-data="" \
            --header="x-cron-secret: $${CRON_SECRET}" \
            "$${MEDIA_SWEEP_URL}" 2>&1) \
            && case "$$body" in
                 *'"deleted":0'*'"truncated":false'*) : ;;   # nothing orphaned — stay quiet
                 *) echo "media-sweep: $$body" ;;
               esac \
            || echo "media-sweep: request FAILED -> $$body"
          sleep "$${MEDIA_SWEEP_INTERVAL_SECONDS}"
        done
