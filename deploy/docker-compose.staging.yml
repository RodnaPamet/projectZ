# Staging (#373): the app only, beside production on the same VM.
#
# It reuses production's database SERVER and Redis SERVER (playerz-db,
# playerz-redis) with its OWN database (playerz_staging) and its own Redis db
# index, so nothing it writes can reach production rows or keys. It talks to
# playerz-db directly, not through playerz-pgbouncer: that pooler is pinned to
# playerz_production, and staging's traffic doesn't need pooling.
#
# Every container name is unique on the host and every hostname is a container
# name (docs/deploy-gcp.md, "EVERY HOSTNAME IS A CONTAINER NAME").
#
#   cd /opt/playerz && sudo docker compose -f docker-compose.staging.yml up -d
#
# The image is built from main on every merge and tagged playerz:staging;
# production keeps playerz:local and moves only on the weekly release.
name: playerz-staging

# Every container's log is capped (#440): Docker's json-file driver, rotated at
# 10 MB and kept to 3 files, so one noisy container holds at most 30 MB of the
# disk this VM shares with agrent. Set per service, never in the daemon's
# config, which is agrent's too. Applies when a container is (re)created.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  playerz-staging-app:
    image: ${PLAYERZ_STAGING_IMAGE:-playerz:staging}
    container_name: playerz-staging-app
    logging: *logging
    restart: always
    env_file: .env.staging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Staging must not starve production on a shared 16 GB box.
    mem_limit: 1g
    networks:
      - playerz_internal
      - agrent_internal

  # ── Chat push (#481) ──
  #
  # Centrifugo v6, the message broker the browser holds a socket to. Memory
  # engine: one instance, and nothing in it is the record. Messages live in
  # Postgres, a publish only tells an open screen to re-read, and a restart
  # costs at most one fast refresh. Configured from its own env file
  # (centrifugo.staging.env, Centrifugo's variable names), written on the VM with the same
  # generated secrets as the app's CENTRIFUGO_* settings (docs/deploy-gcp.md,
  # "Chat push"). Named playerz-staging-centrifugo, not `centrifugo`, for the same DNS reason the
  # app is not `app`: it joins agrent_internal so Caddy can reach it.
  playerz-staging-centrifugo:
    image: centrifugo/centrifugo:v6.9.7
    container_name: playerz-staging-centrifugo
    logging: *logging
    restart: always
    command: centrifugo
    env_file: centrifugo.staging.env
    environment:
      CENTRIFUGO_ENGINE_TYPE: memory
      CENTRIFUGO_HEALTH_ENABLED: 'true'
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: https://staging.playerz.bg
      # Every subscription is asked of the app, which allows only a person's
      # own `notif:` channel (src/lib/realtime/subscribe-authorization.ts).
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_ENDPOINT: http://playerz-staging-app:3000/api/v1/realtime/subscribe
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_TIMEOUT: 3s
      CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"notif","subscribe_proxy_enabled":true}]'
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -qO- http://127.0.0.1:8000/health || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    networks:
      - playerz_internal
      - agrent_internal

networks:
  playerz_internal:
    external: true
  agrent_internal:
    external: true
