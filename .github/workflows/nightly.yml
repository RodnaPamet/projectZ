name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/playerz_test'
  REDIS_URL: 'redis://localhost:6379'
  SKIP_ENV_VALIDATION: '1'
  # Throwaway value so NextAuth can boot in CI. Authenticates nothing.
  NEXTAUTH_SECRET: 'ci-test-secret-not-a-real-key' # pragma: allowlist secret
  NEXTAUTH_URL: 'http://localhost:3000'

jobs:
  # Full cross-browser E2E — chromium runs per-PR, firefox only here,
  # so a slow browser never gates a merge.
  e2e-full:
    name: 'E2E (${{ matrix.browser }})'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    # Runtime connects as `playerz_app`, migrations and the seed as the owner —
    # the same split as ci.yml's E2E job, and for the same reason: this is where
    # the app actually runs, so it is where least privilege can be proved. See
    # that job for the full rationale.
    env:
      DIRECT_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/playerz_test'
      DATABASE_URL: 'postgresql://playerz_app:ci-least-privilege@localhost:5432/playerz_test' # pragma: allowlist secret
    services:
      # postgis/postgis, NOT postgres:16. `prisma migrate deploy` runs
      # `CREATE EXTENSION postgis` and plain Postgres answers `extension
      # "postgis" is not available` — the nightly never reached a single
      # spec. ci.yml has used the PostGIS image at all three call sites
      # since the extension landed; this job was simply never updated.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playerz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
      mailhog:
        image: mailhog/mailhog:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v7
      - name: Bail if not scaffolded
        id: gate
        run: |
          if [ -f package.json ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: ./.github/actions/setup-node-prisma
      - if: steps.gate.outputs.go == 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: steps.gate.outputs.go == 'true'
        run: |
          if [ -d prisma/migrations ]; then npx prisma migrate deploy; fi
          if [ -f scripts/seed.ts ]; then npx tsx scripts/seed.ts; fi
      - name: Give playerz_app a password for this run
        if: steps.gate.outputs.go == 'true'
        # P24 creates the role with LOGIN and no password, so it cannot
        # authenticate as shipped. Must run AFTER migrate deploy, which is what
        # creates it.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d playerz_test -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE playerz_app PASSWORD 'ci-least-privilege';"
      - if: steps.gate.outputs.go == 'true'
        run: npx playwright test --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore

  # Visual regression against the P02 baseline screenshots.
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job declared no services, so it could never have passed: the
    # Playwright globalSetup runs `prisma migrate deploy` + the seed before
    # any spec, and its webServer boots the real app. Without a database
    # the run died at P1001 long before a screenshot was taken.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playerz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
      mailhog:
        image: mailhog/mailhog:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v7
      - id: gate
        run: |
          if [ -n "$(find tests/e2e -name '*-dark.spec.ts' 2>/dev/null)" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: ./.github/actions/setup-node-prisma
      - if: steps.gate.outputs.go == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.go == 'true'
        # --project=chromium is load-bearing. The committed baselines are
        # `*-chromium-linux.png`; Playwright names snapshots per project, so
        # an unpinned run on any other project looks for a file that does not
        # exist and fails as a missing snapshot rather than a real diff.
        run: npx playwright test --project=chromium --grep @visual
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════
  #  A red nightly that nobody sees is the same as no nightly.
  #
  #  Every defect the PostGIS/firefox fix removed had been failing here
  #  for weeks. None of them was subtle; they were simply invisible,
  #  because this workflow reports at 02:00 into a tab nobody opens and
  #  a scheduled run cannot fail a PR. The YAML fixes stop TODAY's four
  #  failures — this job is what stops the next one lasting weeks.
  #
  #  It files ONE issue and keeps commenting on it, rather than opening a
  #  fresh issue per night: a nightly that breaks and stays broken would
  #  otherwise generate an issue every 24h, and the fastest way to make
  #  people ignore an alert is to send it repeatedly.
  # ═══════════════════════════════════════════════════════════════════
  report-failure:
    name: Report nightly failure
    runs-on: ubuntu-latest
    needs: [e2e-full, visual-regression, trivy-full]
    # `failure()` alone would stay silent when a job is cancelled or when
    # one is skipped because an earlier one died — both of which mean the
    # nightly did not prove what it claims to prove.
    # Parenthesised deliberately: `&&` binds tighter than `||` in GitHub
    # expressions, so `always() && A || B` parses as `(always() && A) || B`
    # and the cancelled branch would sit outside the always() guard.
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E: ${{ needs.e2e-full.result }}
          VISUAL: ${{ needs.visual-regression.result }}
          TRIVY: ${{ needs.trivy-full.result }}
        run: |
          set -euo pipefail

          TITLE="Nightly is failing"
          BODY=$(printf '%s\n' \
            "The [Nightly]($RUN_URL) did not pass." \
            "" \
            "| Job | Result |" \
            "| --- | --- |" \
            "| E2E (chromium + firefox) | \`$E2E\` |" \
            "| Visual Regression | \`$VISUAL\` |" \
            "| Trivy (full) | \`$TRIVY\` |" \
            "" \
            "Nothing here gates a merge, which is exactly why it needs saying out loud." \
            "" \
            "_Filed automatically by \`.github/workflows/nightly.yml\`._")

          # --search rather than --label: the label may not exist yet, and a
          # missing label would make this list EMPTY and open a duplicate
          # every single night.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title \
                       --jq "[.[] | select(.title == \"$TITLE\")] | first | .number // empty")

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening a new issue"
            gh issue create --title "$TITLE" --body "$BODY" --label bug
          fi

  trivy-full:
    name: Trivy (full, incl. unfixed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-nightly.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-nightly.sarif
          category: trivy-nightly
