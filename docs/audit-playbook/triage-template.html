<title>__PAGE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a triage desk. Summary strip, then findings grouped by account kind; each row = screenshot · finding · decision. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18201b; --muted:#5d6a61; --line:#d9dfd9;
  --court:#1d6b47; --court-soft:#e2efe7;
  --blocker:#b42318; --blocker-soft:#fde8e6; --major:#b25e09; --major-soft:#fdf0dc; --minor:#56606b; --minor-soft:#eceff2;
  --now:#1d6b47; --next:#2f5fa8; --later:#7a6a2a; --skip:#6b6f74;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --ink:#e7ece8; --muted:#9aa79e; --line:#2c3630;
  --court:#5cc495; --court-soft:#1c3328;
  --blocker:#ff8a7e; --blocker-soft:#3a1b18; --major:#f2b25c; --major-soft:#352612; --minor:#aab3bd; --minor-soft:#252b30;
  --now:#5cc495; --next:#86aef0; --later:#d6c27a; --skip:#9aa0a6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --ink:#e7ece8; --muted:#9aa79e; --line:#2c3630;
  --court:#5cc495; --court-soft:#1c3328;
  --blocker:#ff8a7e; --blocker-soft:#3a1b18; --major:#f2b25c; --major-soft:#352612; --minor:#aab3bd; --minor-soft:#252b30;
  --now:#5cc495; --next:#86aef0; --later:#d6c27a; --skip:#9aa0a6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px);font-weight:750;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:68ch;margin:8px 0 0}
.lede a{color:var(--court)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:750 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.status{font-size:14px;color:var(--muted);margin-top:10px;min-height:1.5em}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;padding-block:12px;margin-top:20px;border-bottom:1px solid var(--line)}
.chip{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.seg button:focus-visible,.thumb:focus-visible,textarea:focus-visible{outline:3px solid var(--court);outline-offset:2px}
section.group{margin-top:36px}
section.group h2{font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:10px}
section.group h2 small{font:500 13px var(--f-mono);color:var(--muted)}
.find{display:grid;grid-template-columns:220px minmax(0,1fr) 230px;gap:18px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sev);border-radius:10px;padding:16px;margin-top:12px}
.find[data-sev="blocker"]{--sev:var(--blocker);--sev-soft:var(--blocker-soft)}
.find[data-sev="major"]{--sev:var(--major);--sev-soft:var(--major-soft)}
.find[data-sev="minor"]{--sev:var(--minor);--sev-soft:var(--minor-soft)}
.thumb{display:block;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);cursor:zoom-in;max-height:300px;width:100%}
.thumb img{display:block;width:100%;height:auto;object-fit:cover;object-position:top}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.id{font:500 13px var(--f-mono);color:var(--muted)}
.sev{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--sev);background:var(--sev-soft);border-radius:4px;padding:2px 6px}
.tag{color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.issue{font:500 13px var(--f-mono);color:var(--court);text-decoration:none;border:1px solid var(--court);border-radius:4px;padding:1px 6px}
.issue.new{background:var(--court-soft)}
.body h3{font:600 18px/1.3 var(--f-body);margin:8px 0 6px}
.body p{margin:4px 0;font-size:15px;max-width:70ch}
.body p em{font-style:normal;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.decide{display:flex;flex-direction:column;gap:8px}
.decide label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 13px var(--f-body);border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 2px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{color:#fff;background:var(--p)}
.seg button[data-p="now"]{--p:var(--now)} .seg button[data-p="next"]{--p:var(--next)} .seg button[data-p="later"]{--p:var(--later)} .seg button[data-p="skip"]{--p:var(--skip)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#111}}
textarea{font:15px/1.4 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;min-height:64px;width:100%}
.saved{font-size:12px;color:var(--muted);min-height:1.2em}
.ro .seg button,.ro textarea{cursor:not-allowed;opacity:.7}
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,1100px)}
dialog::backdrop{background:rgb(0 0 0 / .75)}
dialog img{display:block;max-width:100%;max-height:88vh;border-radius:8px}
dialog p{color:#fff;font-size:14px;margin:8px 0 0}
.empty{color:var(--muted);padding:24px 0}
@media (max-width:860px){.find{grid-template-columns:140px minmax(0,1fr)}.decide{grid-column:1/-1}}
@media (max-width:520px){.find{grid-template-columns:1fr}.thumb{max-height:200px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <p class="lede">__LEDE__</p>
  </header>
  <div class="summary" aria-label="Summary">
    <div class="stat"><span>Blocker</span><b id="c-blocker">0</b></div>
    <div class="stat"><span>Major</span><b id="c-major">0</b></div>
    <div class="stat"><span>Minor</span><b id="c-minor">0</b></div>
    <div class="stat"><span>Decided</span><b id="c-done">0 / 0</b><div class="bar" id="pbar" aria-hidden="true"></div></div>
  </div>
  <p class="status" id="status" role="status">Loading saved decisions…</p>
  <nav class="filters" aria-label="Filters">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="blocker" aria-pressed="false">Blocker</button>
    <button class="chip" data-f="major" aria-pressed="false">Major</button>
    <button class="chip" data-f="minor" aria-pressed="false">Minor</button>
    <button class="chip" data-f="open" aria-pressed="false">Undecided only</button>
  </nav>
  <main id="list"></main>
</div>
<dialog id="lb" aria-label="Screenshot"><img id="lb-img" alt=""><p id="lb-cap"></p></dialog>
<script>
const FINDINGS = __FINDINGS__;
const NEW_ISSUES = new Set(__NEW_ISSUES__); // issue numbers this audit filed
// One group per role, in the order ROLE_ORDER lists them; unlisted roles follow in first-seen order.
const ROLE_ORDER = __ROLE_ORDER__; // e.g. ["visitor","player","club owner"]
const GROUPS = [...new Set([...ROLE_ORDER, ...FINDINGS.map(f => f.account_kind)])]
  .filter(k => FINDINGS.some(f => f.account_kind === k))
  .map(k => [k.charAt(0).toUpperCase() + k.slice(1), x => x === k]);
const SEV_ORDER = {blocker:0, major:1, minor:2};
const P_LABEL = {now:"Now", next:"Next", later:"Later", skip:"Skip"};
const state = {}; // id -> {priority, note}
let db = null, canWrite = true, filter = "all";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function counts(){
  for (const s of ["blocker","major","minor"]) $("#c-"+s).textContent = FINDINGS.filter(f=>f.severity===s).length;
  const decided = FINDINGS.filter(f => state[f.id]?.priority).length;
  $("#c-done").textContent = decided + " / " + FINDINGS.length;
  const bar = $("#pbar"); bar.innerHTML = "";
  for (const p of ["now","next","later","skip"]) {
    const n = FINDINGS.filter(f => state[f.id]?.priority === p).length;
    if (n) { const i = document.createElement("i"); i.style.width = (100*n/FINDINGS.length)+"%"; i.style.background = `var(--${p})`; i.title = `${P_LABEL[p]}: ${n}`; bar.appendChild(i); }
  }
}

function card(f){
  const st = state[f.id] || {};
  const issue = f.existing_issue ? `<a class="issue${NEW_ISSUES.has(f.existing_issue)?" new":""}" href="__ISSUE_URL_BASE__${f.existing_issue}" title="${NEW_ISSUES.has(f.existing_issue)?"New issue from this audit":"Existing issue"}">#${f.existing_issue}</a>` : `<span class="tag">no issue yet</span>`;
  const seg = ["now","next","later","skip"].map(p => `<button type="button" data-p="${p}" aria-pressed="${st.priority===p}" ${canWrite?"":"disabled"}>${P_LABEL[p]}</button>`).join("");
  return `<article class="find${canWrite?"":" ro"}" data-sev="${f.severity}" data-id="${f.id}">
    <button class="thumb" type="button" data-shot="${esc(f.screenshot)}" data-cap="${esc(f.id+" · "+f.title)}" aria-label="Enlarge screenshot for ${esc(f.id)}"><img loading="lazy" src="${esc(f.screenshot)}" alt="Screenshot: ${esc(f.title)}"></button>
    <div class="body">
      <div class="meta"><span class="id">${f.id}</span><span class="sev">${f.severity}</span><span class="tag">${esc(f.area)}</span><span class="tag">${esc(f.viewport === "both" ? "phone + desktop" : f.viewport+" px")}</span>${issue}</div>
      <h3>${esc(f.title)}</h3>
      <p><em>What happens</em>${esc(f.what_happened)}</p>
      <p><em>Expected</em>${esc(f.expected)}</p>
      <p><em>Suggested fix</em>${esc(f.suggested_fix)}</p>
    </div>
    <div class="decide">
      <label id="lab-${f.id}">Priority</label>
      <div class="seg" role="group" aria-labelledby="lab-${f.id}">${seg}</div>
      <label for="note-${f.id}">Note</label>
      <textarea id="note-${f.id}" placeholder="Optional: what you want, or why not" ${canWrite?"":"disabled"}>${esc(st.note||"")}</textarea>
      <div class="saved" id="saved-${f.id}"></div>
    </div>
  </article>`;
}

function render(){
  const shown = FINDINGS.filter(f => filter==="all" ? true : filter==="open" ? !state[f.id]?.priority : f.severity===filter);
  let html = "";
  for (const [name, test] of GROUPS) {
    const items = shown.filter(f => test(f.account_kind)).sort((a,b)=>SEV_ORDER[a.severity]-SEV_ORDER[b.severity] || a.id.localeCompare(b.id));
    if (!items.length) continue;
    html += `<section class="group"><h2>${name} <small>${items.length}</small></h2>${items.map(card).join("")}</section>`;
  }
  $("#list").innerHTML = html || `<p class="empty">Nothing matches this filter. Every finding here has a decision.</p>`;
  counts();
}

// Update one card in place after a remote change, without stealing focus from a note being typed.
function refreshCard(id){
  const el = document.querySelector(`.find[data-id="${id}"]`);
  if (!el) return;
  const st = state[id] || {};
  el.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(st.priority === b.dataset.p)));
  const ta = el.querySelector("textarea");
  if (document.activeElement !== ta && ta.value !== (st.note||"")) ta.value = st.note || "";
}

async function save(id, patch){
  const next = {...(state[id]||{}), ...patch, updatedAt: new Date().toISOString()};
  state[id] = next; counts(); refreshCard(id);
  const msg = $("#saved-"+id);
  if (!db) { if (msg) msg.textContent = "Not saved: storage is unavailable in this view."; return; }
  try { await db.collection("triage").doc(id).set({priority: next.priority||null, note: next.note||"", updatedAt: next.updatedAt}); if (msg) msg.textContent = "Saved"; }
  catch(e){ if (msg) msg.textContent = (e && (e.code==="not_granted"||e.code==="permission_denied")) ? "You can view but not change decisions." : "Couldn't save. Try again."; }
}

$("#list").addEventListener("click", e => {
  const t = e.target.closest(".thumb");
  if (t) { $("#lb-img").src = t.dataset.shot; $("#lb-img").alt = t.dataset.cap; $("#lb-cap").textContent = t.dataset.cap; $("#lb").showModal(); return; }
  const b = e.target.closest(".seg button");
  if (b && canWrite) {
    const id = b.closest(".find").dataset.id;
    const p = state[id]?.priority === b.dataset.p ? null : b.dataset.p;
    save(id, {priority: p});
    if (filter === "open" && p) setTimeout(render, 400);
  }
});
const timers = {};
$("#list").addEventListener("input", e => {
  if (e.target.tagName !== "TEXTAREA") return;
  const id = e.target.closest(".find").dataset.id, v = e.target.value;
  $("#saved-"+id).textContent = "…";
  clearTimeout(timers[id]); timers[id] = setTimeout(() => save(id, {note: v}), 800);
});
$("#lb").addEventListener("click", () => $("#lb").close());
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
  render();
}));

render();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  try { const user = await window.claude?.use?.("user"); const w = user?.can?.("data.write"); if (w === false) canWrite = false; } catch {}
  if (!db) { $("#status").textContent = "Decisions can't be saved in this view. Open the page in claude.ai while signed in."; return; }
  $("#status").textContent = canWrite ? "" : "You can view these decisions but not change them.";
  let first = true;
  db.collection("triage").onSnapshot(snap => {
    for (const d of snap.docs) { const v = d.data() || {}; state[d.id] = {priority: v.priority || null, note: v.note || ""}; }
    if (first) { first = false; render(); } else { snap.docChanges().forEach(ch => refreshCard(ch.doc.id)); counts(); }
  }, () => { $("#status").textContent = "Lost the connection to saved decisions. Reload to try again."; });
})();
</script>
